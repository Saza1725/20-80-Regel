<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lernkartei · Verwaltung</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{
  --ink:#2E2417; --muted:#8C7A64; --border:#E6D6BB; --bg:#FAF1E2; --bg2:#F3E6CF; --card:#FFFCF5;
  --accent:#C1622E; --accent-soft:#F4E0CE; --green:#4F7A5B; --amber:#B9822F; --red:#B0503A;
}
*{box-sizing:border-box;}
body{
  margin:0;color:var(--ink);font-family:'IBM Plex Sans',sans-serif;
  background:
    radial-gradient(circle at 12% 8%, rgba(193,98,46,0.07), transparent 40%),
    radial-gradient(circle at 90% 0%, rgba(79,122,91,0.05), transparent 35%),
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  min-height:100vh;
}
.wrap{max-width:700px;margin:0 auto;padding:48px 22px 70px;}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);letter-spacing:.1em;margin-bottom:6px;font-weight:600;}
h1{font-family:'Fraunces',serif;font-weight:700;font-size:32px;margin:0;letter-spacing:-.01em;}
h2{font-family:'Fraunces',serif;font-weight:700;font-size:25px;margin:0 0 18px 0;}
h3{font-family:'Fraunces',serif;font-weight:600;font-size:19.5px;margin:6px 0 22px 0;line-height:1.4;}
h4{font-family:'Fraunces',serif;font-weight:600;font-size:16.5px;margin:0 0 8px 0;color:var(--ink);}
.sub{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);margin-top:4px;}
.section-label{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);letter-spacing:.08em;margin:24px 0 12px 0;text-transform:uppercase;}
.breadcrumb{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-bottom:22px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
.breadcrumb .sep{color:var(--border);}
.breadcrumb button{background:none;border:none;padding:0;color:var(--muted);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--muted);font:inherit;}
.breadcrumb button:hover{color:var(--accent);border-color:var(--accent);}
.breadcrumb .current{color:var(--ink);font-weight:600;}
.tile{position:relative;text-align:left;width:100%;padding:18px 20px 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);cursor:pointer;margin-bottom:14px;box-shadow:0 1px 2px rgba(46,36,23,0.04);transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;}
.tile.gross{padding:24px 26px 22px;font-size:18px;}
.tile.akzent{border-color:var(--accent);background:linear-gradient(180deg, var(--card), var(--accent-soft) 220%);}
.tile.dashed{border:1.5px dashed var(--border);background:transparent;cursor:default;color:#B3A48C;box-shadow:none;}
.tile:hover:not(.dashed){box-shadow:0 6px 16px rgba(46,36,23,0.09);transform:translateY(-1px);border-color:#D8C39E;}
.tile .tab{position:absolute;top:-7px;left:20px;width:30px;height:9px;background:var(--border);border-radius:5px 5px 0 0;}
.tile.akzent .tab{background:var(--accent);}
.tile.dashed .tab{background:transparent;border:1.5px dashed var(--border);border-bottom:none;}
.tile .ttl{font-family:'Fraunces',serif;font-weight:600;font-size:15.5px;margin-bottom:5px;color:var(--ink);}
.tile.gross .ttl{font-size:18.5px;}
.tile .meta{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);}
.tile.akzent .meta{color:var(--accent);}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 2px rgba(46,36,23,0.04);}
.num{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;margin-bottom:7px;font-weight:600;}
.body-text{margin:0;font-size:14.5px;color:#4A3E2C;line-height:1.65;}
.karte{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px 32px 28px;position:relative;box-shadow:0 4px 14px rgba(46,36,23,0.06);margin-bottom:18px;}
.karte .perf{display:none;}
.karte .toprow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);}
.opt{display:block;width:100%;text-align:left;padding:12px 16px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:var(--ink);cursor:pointer;margin-bottom:10px;transition:border-color .12s ease, background .12s ease;}
.opt:hover:not([disabled]){border-color:var(--accent);}
.opt.selected{border-color:var(--ink);background:var(--bg);}
.opt.correct{border-color:var(--green);background:#EAF1EB;}
.opt.wrong{border-color:var(--red);background:#F7EAE5;}
.opt[disabled]{cursor:default;}
textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;font-family:'IBM Plex Sans',sans-serif;font-size:14.5px;color:var(--ink);resize:vertical;box-sizing:border-box;outline:none;background:#fff;}
textarea:focus{border-color:var(--accent);}
textarea[disabled]{background:var(--bg);}
button.primary{background:var(--ink);color:var(--card);border:none;padding:10px 22px;border-radius:9px;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.03em;cursor:pointer;}
button.primary:hover:not(:disabled){background:#443622;}
button.primary:disabled{background:var(--border);cursor:default;}
button.ghost{background:transparent;border:1.5px solid var(--border);color:var(--ink);padding:9px 18px;border-radius:9px;font-family:'IBM Plex Mono',monospace;font-size:13px;cursor:pointer;}
button.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
button.ghost:disabled{color:var(--border);cursor:default;}
button.danger{background:var(--accent);color:#fff;border:none;padding:12px 28px;border-radius:9px;font-family:'IBM Plex Mono',monospace;font-size:13.5px;letter-spacing:.04em;cursor:pointer;}
button.danger:hover{background:#A85224;}
.stamp{display:inline-block;border:3px solid var(--muted);font-family:'IBM Plex Mono',monospace;font-weight:600;letter-spacing:.12em;padding:5px 16px;border-radius:6px;transform:rotate(-3deg);font-size:13px;}
.stamp.richtig{border-color:var(--green);color:var(--green);}
.stamp.teilweise{border-color:var(--amber);color:var(--amber);}
.stamp.falsch{border-color:var(--red);color:var(--red);}
.solution{margin-top:22px;border-top:1px dashed var(--border);padding-top:20px;}
.solution-box{background:var(--bg);border-left:3px solid var(--accent);padding:14px 16px;border-radius:0 10px 10px 0;}
.solution-box .lbl{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:.08em;margin-bottom:6px;font-weight:600;}
.progressbar{display:flex;gap:5px;margin-bottom:20px;flex-wrap:wrap;}
.progressbar span{width:22px;height:6px;border-radius:4px;background:var(--border);cursor:pointer;opacity:.6;}
.progressbar span.active{opacity:1;}
.progressbar span.richtig{background:var(--green);}
.progressbar span.teilweise{background:var(--amber);}
.progressbar span.falsch{background:var(--red);}
.navrow{display:flex;justify-content:space-between;margin-top:22px;}
.center-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:30px;text-align:center;box-shadow:0 4px 14px rgba(46,36,23,0.06);}
.self-grade{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.self-grade button{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;border:1.5px solid var(--border);background:#fff;}
.self-grade button.richtig-btn{border-color:var(--green);color:var(--green);}
.self-grade button.teilweise-btn{border-color:var(--amber);color:var(--amber);}
.self-grade button.falsch-btn{border-color:var(--red);color:var(--red);}
.hinweis{font-size:13px;color:var(--muted);margin:0 0 18px 0;font-style:italic;}
select{border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink);background:#fff;}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<script>

/* ------------------------------------------------------------------
   Fachbereich: Kosten- und Leistungsrechnung (KLR) – Modul Vfal90
------------------------------------------------------------------- */

const TOPICS_KLR = [
  {
    id: "grundbegriffe",
    titel: "Grundbegriffe & Abgrenzung",
    kurz: "Grundbegriffe",
    nachschlagen: [
      { h: "Kosten vs. Ausgaben/Aufwand", t: "Kosten sind der leistungsbezogene, sachzielorientierte Werteverzehr einer Periode – unabhängig davon, ob dafür Geld fließt. Aufwand ist der bewertete Güterverbrauch laut Finanzbuchhaltung. Beide Größen fallen zeitlich und betragsmäßig oft auseinander." },
      { h: "Das Vier-Felder-Schema", t: "Gesamtaufwand (Bilanzrechnung) gliedert sich in neutralen Aufwand und Zweckaufwand. Neutraler Aufwand ist betriebsfremd, außerordentlich oder periodenfremd und bleibt in der KLR unberücksichtigt. Zweckaufwand wird entweder unverändert als Kosten verrechnet (Grundkosten) oder nicht als Kosten verrechnet, weil dafür kalkulatorische Kosten angesetzt werden (Anderskosten, z. B. kalkulatorische Abschreibung statt bilanzieller AfA). Zusätzlich gibt es Zusatzkosten: kalkulatorische Kosten ohne jeden Aufwand in der Finanzbuchhaltung (z. B. kalkulatorischer Unternehmerlohn). Gesamtkosten (Kostenrechnung) = Grundkosten + kalkulatorische Kosten (Anderskosten + Zusatzkosten)." },
      { h: "Merksatz", t: "Grundkosten = Zweckaufwand, der 1:1 als Kosten übernommen wird. Anderskosten ersetzen einen vorhandenen Aufwand durch einen anders bewerteten kalkulatorischen Ansatz. Zusatzkosten haben gar keine Entsprechung im Aufwand." },
    ],
    fragen: [
      { id: "kb-01", typ: "mc", frage: "Welche Aussage zum Verhältnis von Kosten und Ausgaben trifft zu?", optionen: ["Jede Ausgabe ist zugleich eine Kosten, nur zeitversetzt.", "Kosten sind der leistungsbezogene, sachzielorientierte Werteverzehr einer Periode – unabhängig davon, ob dafür Geld fließt.", "Ausgaben entstehen nur in der Kostenrechnung, Kosten nur in der Finanzrechnung.", "Kosten und Ausgaben sind in der Kommunalverwaltung immer identisch."], loesung: 1, erlaeuterung: "Kosten sind der bewertete, leistungsbezogene Verbrauch von Gütern und Diensten einer Periode. Ausgaben betreffen den Geldabfluss – beide Größen können zeitlich und betragsmäßig auseinanderfallen." },
      { id: "kb-02", typ: "freitext", frage: "Reisekosten von Mitarbeitern der Verwaltung zur Fortbildung 'Doppik in der Kommunalverwaltung' – neutraler Aufwand, Grundkosten, Anderskosten oder Zusatzkosten? Begründe kurz.", musterloesung: "Grundkosten: Es handelt sich um betriebsbezogenen Zweckaufwand (Reisekosten für dienstliche Fortbildung), der unverändert in gleicher Höhe als Kosten übernommen wird." },
      { id: "kb-03", typ: "mc", frage: "Wie wird die kalkulatorische Abschreibung des Dienstwagens eingeordnet?", optionen: ["Grundkosten", "Anderskosten", "Zusatzkosten", "Neutraler Aufwand"], loesung: 1, erlaeuterung: "Anderskosten: Der bilanziellen AfA steht ein kalkulatorischer Ansatz gegenüber (z. B. auf Wiederbeschaffungswert und individuelle Nutzungsdauer bezogen), der Aufwand wird also nicht 1:1, sondern 'anders' bewertet übernommen." },
      { id: "kb-04", typ: "mc", frage: "Zinsen für das eingesetzte Eigen- und Fremdkapital in der KLR (kalkulatorische Zinsen) sind ...", optionen: ["reine Grundkosten, da immer ein Aufwand in gleicher Höhe existiert", "eine Mischung aus Anderskosten (für verzinstes Fremdkapital) und Zusatzkosten (für Eigenkapital, dem kein Aufwand gegenübersteht)", "immer neutraler Aufwand", "in der Kommunalverwaltung nicht zulässig"], loesung: 1, erlaeuterung: "Für verzinsliches Fremdkapital besteht bereits ein Aufwand (Zinsaufwand) – der kalkulatorische Ansatz ersetzt ihn ggf. anders bewertet (Anderskosten). Für das Eigenkapital gibt es keinen Aufwand, hier entstehen reine Zusatzkosten." },
      { id: "kb-05", typ: "freitext", frage: "Die Abschreibung eines nicht mehr genutzten Gerätehauses im Stadtpark – wie wird sie eingeordnet und warum?", musterloesung: "Neutraler Aufwand (betriebsfremd): Das Gerätehaus wird nicht mehr genutzt, der Werteverzehr dient also nicht der eigentlichen Leistungserstellung und fließt nicht in die Kostenrechnung ein." },
      { id: "kb-06", typ: "freitext", frage: "Ein außerordentlich hoher Forderungsausfall des Eigenbetriebs 'Trinkwasser' durch Insolvenz eines Unternehmens – neutraler Aufwand oder Kosten?", musterloesung: "Neutraler Aufwand (außerordentlich): Es handelt sich um ein einmaliges, untypisches Ereignis, das nicht regelmäßig mit der laufenden Leistungserstellung zusammenhängt und daher nicht in die Kostenrechnung einfließt." },
      { id: "kb-07", typ: "mc", frage: "Zinserträge aus einer Geldanlage der Kommune sind in der Abgrenzung Aufwand/Ertrag ...", optionen: ["Aufwand", "Ertrag", "weder Aufwand noch Ertrag"], loesung: 1, erlaeuterung: "Zinserträge sind ein Ertrag – ein Wertezuwachs der Periode." },
      { id: "kb-08", typ: "mc", frage: "Der Abschluss einer Versicherung, bei dem nur der Vertrag unterschrieben wird und noch keine Zahlung erfolgt, ist ...", optionen: ["Aufwand", "Ertrag", "weder Aufwand noch Ertrag"], loesung: 2, erlaeuterung: "Der reine Vertragsabschluss ohne Zahlung oder Werteverzehr ist weder Aufwand noch Ertrag – erst die spätere Prämienzahlung bzw. der Versicherungsschutzverbrauch wird relevant." },
    ],
  },
  {
    id: "abschreibung",
    titel: "Kalkulatorische Abschreibung",
    kurz: "Abschreibung",
    nachschlagen: [
      { h: "Warum wird abgeschrieben?", t: "Anlagegüter verlieren durch Nutzung, technischen Fortschritt, natürlichen Verschleiß oder außergewöhnliche Ereignisse an Wert. Die Abschreibung (AfA = Absetzung für Abnutzung) verteilt die Anschaffungskosten auf die Nutzungsdauer, damit später aus den erwirtschafteten Mitteln eine Ersatzinvestition finanziert werden kann (Abschreibungskreislauf)." },
      { h: "Lineare AfA – Formeln", t: "AfA-Betrag = Anschaffungs-/Wiederbeschaffungswert ÷ Nutzungsdauer. AfA-Satz (%) = 100 % ÷ Nutzungsdauer. Bei linearer Abschreibung bleiben die jährlichen Beträge über die gesamte Nutzungsdauer gleich." },
      { h: "Bilanzielle vs. kalkulatorische Abschreibung", t: "Bilanziell: Basis sind die tatsächlichen Anschaffungs-/Herstellungskosten, Nutzungsdauer nach steuerlichen AfA-Tabellen, Zweck ist die Bilanzpolitik, Rechtsgrundlage Steuerrecht/HGB. Kalkulatorisch: Basis ist der Wiederbeschaffungswert (Tageswert), Nutzungsdauer wird betriebsindividuell geschätzt, Zweck ist die Substanzerhaltung, keine gesetzliche Grundlage." },
      { h: "Warum Wiederbeschaffungswert?", t: "Damit die Kommune aus den kalkulierten Gebühren/Kosten tatsächlich in der Lage ist, das Anlagegut zum aktuellen (oft gestiegenen) Preis zu ersetzen – nicht nur zum historischen Anschaffungspreis." },
    ],
    fragen: [
      { id: "afa-01", typ: "mc", frage: "Auf welcher Wertbasis werden kalkulatorische Abschreibungen in der Kommunalverwaltung grundsätzlich berechnet?", optionen: ["Anschaffungs- bzw. Herstellungswert", "Wiederbeschaffungswert (Tageswert)", "Buchwert laut Bilanz des Vorjahres", "Verkehrswert des Grundstücks"], loesung: 1, erlaeuterung: "Anders als in der Handelsbilanz wird in der KLR meist der Wiederbeschaffungswert angesetzt, damit die spätere Ersatzbeschaffung finanziert werden kann (Substanzerhaltung)." },
      { id: "afa-02", typ: "freitext", frage: "Bei Anschaffungskosten von 100.000 € und einer Nutzungsdauer von 5 Jahren: Wie hoch sind AfA-Betrag und AfA-Satz?", musterloesung: "AfA-Betrag = 100.000 € / 5 = 20.000 € pro Jahr. AfA-Satz = 100 % / 5 = 20 % pro Jahr." },
      { id: "afa-03", typ: "freitext", frage: "Stadtwerke Neustadt: LKW-Anschaffungswert 100.000 €, betriebsgewöhnliche Nutzungsdauer lt. Abschreibungstabelle 4 Jahre. Wiederbeschaffungswert 150.000 €, tatsächliche Nutzungsdauer 10 Jahre. Berechne die bilanzielle und die kalkulatorische Abschreibung pro Jahr sowie jeweils den Restwert am Ende des 1. Nutzungsjahres.", musterloesung: "Bilanziell: 100.000 € / 4 Jahre = 25.000 €/Jahr; Restwert Ende Jahr 1 = 100.000 − 25.000 = 75.000 €. Kalkulatorisch: 150.000 € / 10 Jahre = 15.000 €/Jahr; Restwert Ende Jahr 1 = 150.000 − 15.000 = 135.000 €." },
      { id: "afa-04", typ: "freitext", frage: "Kehrmaschine Stadt S: Anschaffungswert 80.000 €, Nutzungsdauer 8 Jahre. Berechne die lineare Abschreibung für das 1. und 2. Nutzungsjahr sowie die Restwerte, wenn vom Anschaffungswert abgeschrieben wird (Fall a).", musterloesung: "AfA = 80.000 € / 8 = 10.000 €/Jahr. Restwert nach Jahr 1: 80.000 − 10.000 = 70.000 €. Restwert nach Jahr 2: 70.000 − 10.000 = 60.000 €." },
      { id: "afa-05", typ: "freitext", frage: "Gleiche Kehrmaschine (Anschaffungswert 80.000 €, Nutzungsdauer 8 Jahre), aber die Preise für Kehrmaschinen sind in den letzten 8 Jahren um 40 % gestiegen. Berechne die kalkulatorische Abschreibung vom Wiederbeschaffungswert für das 1. und 2. Nutzungsjahr sowie die jeweiligen Restwerte.", musterloesung: "Wiederbeschaffungswert = 80.000 € × 1,4 = 112.000 €. AfA = 112.000 € / 8 = 14.000 €/Jahr. Restwert nach Jahr 1: 112.000 − 14.000 = 98.000 €. Restwert nach Jahr 2: 98.000 − 14.000 = 84.000 €." },
      { id: "afa-06", typ: "mc", frage: "Warum ist bei der Kehrmaschine der ursprüngliche Anschaffungspreis nicht als Kosten in der Kostenrechnung anzusetzen?", optionen: ["Weil Anschaffungspreise grundsätzlich nie Kosten sind", "Weil nur der auf die Nutzungsdauer verteilte, ggf. am Wiederbeschaffungswert orientierte Werteverzehr (kalkulatorische Abschreibung) periodengerecht und verursachungsgerecht ist, nicht der einmalige Anschaffungspreis als Ganzes", "Weil die Stadt die Maschine ohnehin nie ersetzen wird", "Weil der Marktstandsgeld-Ertrag höher als der Anschaffungspreis ist"], loesung: 1, erlaeuterung: "Die Anschaffung ist eine einmalige Ausgabe; für die Kostenrechnung wird der Werteverzehr periodengerecht über die Nutzungsdauer verteilt (Abschreibung), damit jede Periode nur den ihr zurechenbaren Anteil trägt." },
      { id: "afa-07", typ: "freitext", frage: "Nenne zwei Unterschiede zwischen bilanzieller und kalkulatorischer Abschreibung.", musterloesung: "Z. B.: (1) Abschreibungsbasis – bilanziell Anschaffungs-/Herstellungskosten, kalkulatorisch meist Wiederbeschaffungswert. (2) Zweck – bilanziell Bilanzpolitik/Steuerrecht, kalkulatorisch Substanzerhaltung. Weitere mögliche Unterschiede: Nutzungsdauer (gesetzliche AfA-Tabelle vs. betriebsindividuelle Schätzung) und Rechtsgrundlage (Steuerrecht/HGB vs. keine)." },
    ],
  },
  {
    id: "zinsen",
    titel: "Kalkulatorische Zinsen",
    kurz: "Zinsen",
    nachschlagen: [
      { h: "Was sind kalkulatorische Zinsen?", t: "Berechnete Zinsen in der KLR für das gesamte eingesetzte betriebsnotwendige Kapital – auch für Eigenkapital, obwohl dafür keine direkten Zinszahlungen anfallen. Merksatz: Kalkulatorische Zinsen machen die versteckten Kosten des Eigenkapitals sichtbar." },
      { h: "Warum werden sie berechnet?", t: "Eigenkapital ist anderen zinsbringenden Anlagen entzogen (Opportunitätskosten). Der Verzicht auf mögliche Zinserträge ist Ressourcenverbrauch. Sie sorgen für vollständige Kostenerfassung und bessere Vergleichbarkeit zwischen Betrieben durch einen einheitlichen Mischzinssatz." },
      { h: "Restwertmethode", t: "Es wird nur der jährlich sinkende Restwert verzinst: Kalkulatorische Zinsen (Jahr n) = Restwert am Jahresende × Zinssatz/100. Die Zinsbelastung sinkt mit abnehmendem Restwert – bildet die tatsächliche Belastung relativ gut ab." },
      { h: "Durchschnittswertmethode (Halbwertmethode)", t: "Es wird mit einem konstanten Durchschnittswert gerechnet: ohne Rest-/Endwert = Anschaffungswert / 2; mit Rest-/Endwert = (Anfangswert + Endwert) / 2. Kalkulatorische Zinsen (pro Jahr) = Durchschnittswert × Zinssatz/100. Die Zinsen bleiben über alle Jahre konstant – einfache, schnelle Berechnung." },
      { h: "Bilanzielle vs. kalkulatorische Zinsen", t: "Bilanzielle Zinsen = nur Fremdkapital × vereinbarter Zinssatz. Kalkulatorische Zinsen = (Fremdkapital + Eigenkapital) × marktüblicher Zinssatz. Kalkulatorische Zinsen berücksichtigen zusätzlich die Opportunitätskosten des Eigenkapitals und ermöglichen realistische Vergleiche sowie verursachungsgerechte Gebührenkalkulation." },
    ],
    fragen: [
      { id: "zi-01", typ: "freitext", frage: "Durchschnittlich gebundenes Kapital 30.000 €, kalkulatorischer Zinssatz 5 %. Wie hoch sind die kalkulatorischen Zinsen pro Jahr?", musterloesung: "Kalkulatorische Zinsen = 30.000 € × 5 % = 1.500 € pro Jahr." },
      { id: "zi-02", typ: "freitext", frage: "Bauhof Musterstadt: Fremdkapital (Bankdarlehen) 200.000 € zu 4 % p. a., Eigenkapital 300.000 €, marktüblicher Zinssatz 5 % p. a. Berechne die bilanziellen und die kalkulatorischen Zinsen.", musterloesung: "Bilanzielle Zinsen = 200.000 € × 4 % = 8.000 €/Jahr (nur Fremdkapital). Kalkulatorische Zinsen = (200.000 € + 300.000 €) × 5 % = 500.000 € × 5 % = 25.000 €/Jahr (Fremd- und Eigenkapital zum marktüblichen Satz)." },

      { h: "Warum wird ausgelegt?", t: "Normen sind oft abstrakt formuliert. Der Gesetzesanwender muss daher den objektivierten Willen des Gesetzgebers ermitteln – das ist die Aufgabe der Auslegung. Im Gutachtenstil gehört sie zur Definition des Tatbestands. Ziel ist nicht nur der 'Normzweck', sondern die Gesamtschau aller anerkannten Methoden (BVerwG)." },
      { h: "Maßstab des BVerfG", t: "Maßgebend ist der in der Norm zum Ausdruck kommende objektivierte Wille des Gesetzgebers, wie er sich aus Wortlaut und Sinnzusammenhang ergibt (st. Rspr., z. B. BVerfGE 1, 299; 11, 126; 105, 135). Die anerkannten Methoden (Wortlaut, Systematik, Sinn und Zweck, Entstehungsgeschichte) ergänzen sich gegenseitig – keine hat einen unbedingten Vorrang." },
      { h: "Wichtigster Grundsatz", t: "Die Auslegung darf nie gegen den klaren Wortlaut oder den klar erkennbaren Willen des Gesetzgebers verstoßen. Der Richter/Anwender darf die intendierte Regelungskonzeption nicht verfehlen oder verfälschen und keine eigene an deren Stelle setzen (BVerfGE 78, 20). Die Methoden sind gleichrangig – starre Rangfolgen gibt es nicht." },

      { h: "Was ist das?", t: "Die Norm wird nicht isoliert, sondern in der Gesamtschau mit anderen Normen des Gesetzes und der gesamten Rechtsordnung betrachtet ('Einheit der Rechtsordnung'). Grundsätzlich wird von einheitlicher Terminologie ausgegangen (nicht zwingend). Bei Widersprüchen ist richtlinien- und verfassungskonform auszulegen." },
      { h: "Systematische Analysefragen", t: "In welchem Kontext steht die Norm (weitere Absätze, Nachbarnormen)? Was sagt die Überschrift des Gesetzes/Abschnitts (echte Überschrift vs. unechte in eckigen Klammern, oft vom Herausgeber)? Wird der Begriff bereits in anderen Normen desselben Gesetzes verwendet? Welche Stellung hat die Norm (Ausnahmevorschrift oder Grundregel)?" },

      { id: "avr-sy-03", typ: "freitext", frage: "Worin liegt der Unterschied zwischen einer 'echten' und einer 'unechten' Überschrift bei der systematischen Auslegung?", musterloesung: "Echte Überschriften stammen vom Gesetzgeber selbst und können bei der systematischen Auslegung herangezogen werden. Unechte Überschriften (oft in eckigen Klammern) stammen dagegen vom Herausgeber/Verleger und haben keine eigenständige Aussagekraft für den gesetzgeberischen Willen." },

      { h: "Drei Argumenttypen nach Muthorst (JA 2013)", t: "Abstammungsgeschichte: Jede Norm knüpft an einen früheren Rechtszustand an (was soll bewahrt, was geändert werden?). Schöpfungsgeschichte: Die Norm entsteht aus einem Verfahren, in dem Regelungsbedarf, Programm und Alternativen erwogen wurden. 'Kind seiner Zeit': Das Gesetz wurde unter bestimmten historischen Umständen erlassen – auch das kann für eine Auslegung sprechen." },

      { h: "Was ist das?", t: "Es wird hinterfragt, welchen Zweck das Gesetz bzw. die Vorschrift verfolgt. Die Norm wird so ausgelegt, dass Sinn und Zweck am ehesten verwirklicht werden. Jede Rechtsnorm ist Ausdruck eines Interessenkonflikts, den der Gesetzgeber bewertet hat, um bestimmte Folgen zu erreichen oder zu vermeiden." },

      { id: "avr-te-03", typ: "freitext", frage: "Mit welcher anderen Auslegungsmethode wird die teleologische Auslegung häufig kombiniert, und warum?", musterloesung: "Mit der historischen Auslegung: Aus den Gesetzesmaterialien wird der tatsächliche Zweck der Norm abgeleitet, um zu vermeiden, dass der Auslegende eigene Zielvorstellungen statt der des Gesetzgebers zugrunde legt." },

      { h: "Analogie", t: "Ergänzt einen zu eng gefassten Wortlaut. Greift nur bei einer planwidrigen Regelungslücke (der Gesetzgeber hat die Lücke nicht bewusst gewollt). Im Strafrecht ist eine Analogie zu Lasten des Täters verboten (Art. 103 Abs. 2 GG). Beispiel: § 80 Abs. 2 Nr. 2 VwGO (Wegfall der aufschiebenden Wirkung bei VA von Polizeibeamten) wird analog auf Verkehrszeichen angewendet." },
      { h: "Teleologische Reduktion", t: "Das Gegenstück zur Analogie: grenzt eine zu weit gefasste Vorschrift ein, damit ihr Zweck nicht überschritten wird. Beispiel: § 212 StGB ('wer einen anderen tötet') könnte wortlautgemäß auch Selbstmord erfassen – teleologisch wird die Norm auf 'einen anderen' reduziert, da ihr Zweck der Schutz fremden Lebens ist. Selbstmord bleibt straflos." },
      { h: "Erst-Recht-Schluss (a maiore ad minus)", t: "Ist eine belastendere Maßnahme ausdrücklich erlaubt/geregelt, muss erst recht die weniger belastende Maßnahme möglich sein. Beispiel: Wenn Art. 9 Abs. 2 GG das Verbot verfassungsfeindlicher Vereinigungen gestattet (schwereres Mittel), ist erst recht die weniger belastende geheimdienstliche Beobachtung zulässig." },

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function alleFragenMitThema(subject) {
  const out = [];
  subject.topics.forEach((top) => {
    top.fragen.forEach((f) => out.push({ ...f, thema: top.titel, themaId: top.id }));
  });
  return out;
}

// ---------------- App-Status (nur im Speicher dieser Sitzung, kein Server, kein Login) ----------------
const state = {
  screen: "home",
  fach: SUBJECTS[0].id,
  themaId: null,
  index: 0,
  ergebnisse: {}, // key: "fachId:themaId" -> { fragenId: {status} }
  pruefungAktiv: false,
  pruefungsfragen: [],
  pruefungIndex: 0,
  pruefungsErgebnisse: {},
  anzahl: 10,
  cardState: {}, // pro Frage: { auswahl, geprueft, geloest }
};

function aktuellesFach() { return SUBJECTS.find(s => s.id === state.fach); }
function aktuellesThema() {
  const f = aktuellesFach();
  if (!f) return null;
  return f.topics.find(t => t.id === state.themaId) || (f.extra ? f.extra.find(t => t.id === state.themaId) : null);
}
function ergebnisKey() { return state.fach + ":" + state.themaId; }
function ergebnisseFuerThema() { return state.ergebnisse[ergebnisKey()] || {}; }

function gehezuHome() { state.screen = "home"; state.pruefungAktiv = false; render(); }
function gehezuFach(id) { state.fach = id; state.screen = "subject"; state.pruefungAktiv = false; render(); }
function gehezuThema(id) { state.themaId = id; state.screen = "topic"; state.index = 0; state.cardState = {}; render(); }
function gehezuPruefung() { state.screen = "exam"; state.pruefungAktiv = false; render(); }

function starteNeuePruefung() {
  const pool = alleFragenMitThema(aktuellesFach());
  const n = Math.min(state.anzahl, pool.length);
  state.pruefungsfragen = shuffle(pool).slice(0, n);
  state.pruefungsErgebnisse = {};
  state.pruefungIndex = 0;
  state.pruefungAktiv = true;
  state.cardState = {};
  render();
}

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// ---------------- Bausteine ----------------
function stempel(status) {
  const cfg = { richtig: "RICHTIG", teilweise: "TEILWEISE", falsch: "NICHT KORREKT" }[status];
  if (!cfg) return "";
  return `<div class="stamp ${status}">${cfg}</div>`;
}

function karteikarte(frage, index, total, ergebnisseObj, zeigeThema, onAnswered) {
  const cs = state.cardState[frage.id] || { auswahl: null, geprueft: !!ergebnisseObj[frage.id] };
  state.cardState[frage.id] = cs;
  const gespeichert = ergebnisseObj[frage.id];
  const geprueft = cs.geprueft || !!gespeichert;
  const status = gespeichert ? gespeichert.status : cs.status;

  let inner = "";
  if (frage.typ === "mc") {
    inner += `<div>`;
    frage.optionen.forEach((opt, i) => {
      const istGewaehlt = cs.auswahl === i;
      const zeigeRichtig = geprueft && i === frage.loesung;
      const zeigeFalsch = geprueft && istGewaehlt && i !== frage.loesung;
      let cls = "opt";
      if (zeigeRichtig) cls += " correct";
      else if (zeigeFalsch) cls += " wrong";
      else if (istGewaehlt) cls += " selected";
      inner += `<button class="${cls}" ${geprueft ? "disabled" : ""} onclick="waehleOption('${frage.id}', ${i})">${esc(opt)}</button>`;
    });
    if (!geprueft) {
      inner += `<button class="primary" ${cs.auswahl === null ? "disabled" : ""} onclick="pruefeMC('${frage.id}', ${index}, ${JSON.stringify(zeigeThema)})">Prüfen</button>`;
    }
    inner += `</div>`;
  } else {
    inner += `<textarea id="ft-${frage.id}" rows="4" placeholder="Deine Antwort..." ${geprueft ? "disabled" : ""}>${cs.freitext || ""}</textarea>`;
    if (!geprueft) {
      inner += `<div style="margin-top:10px;"><button class="primary" onclick="zeigeLoesung('${frage.id}')">Lösung anzeigen</button></div>
        <p class="hinweis" style="margin-top:8px;">Diese Version läuft ohne Claude-Konto – die Freitextantwort wird nicht automatisch bewertet. Vergleiche selbst mit der Musterlösung und markiere dein Ergebnis.</p>`;
    }
  }

  let solutionBlock = "";
  if (geprueft) {
    solutionBlock = `<div class="solution">
      <div style="margin-bottom:10px;">${stempel(status)}</div>
      <div class="solution-box">
        <div class="lbl">${frage.typ === "mc" ? "LÖSUNG" : "MUSTERLÖSUNG"}</div>
        <p class="body-text">${esc(frage.typ === "mc" ? frage.erlaeuterung : frage.musterloesung)}</p>
      </div>
    </div>`;
  } else if (frage.typ === "freitext" && cs.zeigeLoesung) {
    solutionBlock = `<div class="solution">
      <div class="solution-box">
        <div class="lbl">MUSTERLÖSUNG</div>
        <p class="body-text">${esc(frage.musterloesung)}</p>
      </div>
      <div class="self-grade">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);align-self:center;">Deine Selbsteinschätzung:</span>
        <button class="richtig-btn" onclick="selbstBewertung('${frage.id}', 'richtig', ${index}, ${JSON.stringify(zeigeThema)})">Richtig</button>
        <button class="teilweise-btn" onclick="selbstBewertung('${frage.id}', 'teilweise', ${index}, ${JSON.stringify(zeigeThema)})">Teilweise</button>
        <button class="falsch-btn" onclick="selbstBewertung('${frage.id}', 'falsch', ${index}, ${JSON.stringify(zeigeThema)})">Nicht korrekt</button>
      </div>
    </div>`;
  }

  return `<div class="karte">
    <div class="perf"></div>
    <div class="toprow">
      <span>Az. ${frage.id.toUpperCase()}${zeigeThema && frage.thema ? " · " + esc(frage.thema) : ""}</span>
      <span>${index + 1} / ${total}</span>
    </div>
    <h3>${esc(frage.frage)}</h3>
    ${inner}
    ${solutionBlock}
  </div>`;
}

function waehleOption(fid, i) {
  const cs = state.cardState[fid];
  if (cs.geprueft) return;
  cs.auswahl = i;
  render();
}

function pruefeMC(fid, index, imExamen) {
  const cs = state.cardState[fid];
  if (cs.auswahl === null || cs.auswahl === undefined) return;
  const frage = findFrage(fid);
  const status = cs.auswahl === frage.loesung ? "richtig" : "falsch";
  cs.geprueft = true;
  cs.status = status;
  speichereErgebnis(fid, { status }, imExamen);
  render();
}

function zeigeLoesung(fid) {
  const cs = state.cardState[fid];
  cs.freitext = document.getElementById("ft-" + fid) ? document.getElementById("ft-" + fid).value : (cs.freitext || "");
  cs.zeigeLoesung = true;
  render();
}

function selbstBewertung(fid, status, index, imExamen) {
  const cs = state.cardState[fid];
  cs.geprueft = true;
  cs.status = status;
  speichereErgebnis(fid, { status }, imExamen);
  render();
}

function findFrage(fid) {
  if (state.pruefungAktiv) {
    return state.pruefungsfragen.find(f => f.id === fid);
  }
  const t = aktuellesThema();
  return t ? t.fragen.find(f => f.id === fid) : null;
}

function speichereErgebnis(fid, ergebnis, imExamen) {
  if (imExamen) {
    state.pruefungsErgebnisse[fid] = ergebnis;
  } else {
    const key = ergebnisKey();
    if (!state.ergebnisse[key]) state.ergebnisse[key] = {};
    state.ergebnisse[key][fid] = ergebnis;
  }
}

function fortschrittsleiste(fragen, ergebnisseObj, aktuellerIndex, onJump) {
  return `<div class="progressbar">${fragen.map((f, i) => {
    const r = ergebnisseObj[f.id];
    const cls = r ? r.status : "";
    return `<span class="${cls} ${i === aktuellerIndex ? "active" : ""}" title="Frage ${i + 1}" onclick="${onJump}(${i})"></span>`;
  }).join("")}</div>`;
}

function breadcrumb(teile) {
  return `<div class="breadcrumb">${teile.map((t, i) => {
    const sep = i > 0 ? '<span class="sep">/</span>' : "";
    const el = t.onClick ? `<button onclick="${t.onClick}">${esc(t.label)}</button>` : `<span class="current">${esc(t.label)}</span>`;
    return sep + el;
  }).join("")}</div>`;
}

function ordnerkachel(titel, unterzeile, onClick, opts) {
  opts = opts || {};
  const cls = "tile" + (opts.gross ? " gross" : "") + (opts.akzent ? " akzent" : "") + (opts.dashed ? " dashed" : "");
  const clickAttr = opts.dashed ? "" : ` onclick="${onClick}"`;
  return `<button class="${cls}"${clickAttr}><div class="tab"></div><div class="ttl">${esc(titel)}</div>${unterzeile ? `<div class="meta">${esc(unterzeile)}</div>` : ""}</button>`;
}

function kopf(ueberschrift, unterzeile) {
  return `<header style="margin-bottom:22px;">
    <div class="eyebrow">LERNKARTEI · VERWALTUNG</div>
    <h1>${esc(ueberschrift)}</h1>
    ${unterzeile ? `<div class="sub">${esc(unterzeile)}</div>` : ""}
  </header>`;
}

// ---------------- Navigation innerhalb Thema/Prüfung ----------------
function themaWeiter() { const t = aktuellesThema(); state.index = Math.min(t.fragen.length - 1, state.index + 1); render(); }
function themaZurueck() { state.index = Math.max(0, state.index - 1); render(); }
function themaSpringe(i) { state.index = i; render(); }
function examWeiter() { state.pruefungIndex = Math.min(state.pruefungsfragen.length - 1, state.pruefungIndex + 1); render(); }
function examZurueck() { state.pruefungIndex = Math.max(0, state.pruefungIndex - 1); render(); }
function examSpringe(i) { state.pruefungIndex = i; render(); }
function examAbbrechen() { state.pruefungAktiv = false; render(); }
function setAnzahl(v) { state.anzahl = Number(v); }

// ---------------- Screens ----------------
function renderHome() {
  let html = kopf("Lernkartei", "Az. Übersicht · Fachbereiche");
  html += `<div class="section-label">FACHBEREICHE</div>`;
  SUBJECTS.forEach(s => {
    const pool = alleFragenMitThema(s);
    html += ordnerkachel(s.titel, `Az. ${s.az} · ${s.topics.length} Themengebiete · ${pool.length} Fragen`, `gehezuFach('${s.id}')`, { gross: true });
  });
  html += ordnerkachel("+ weitere Fachbereiche", "folgen, sobald Skripte hochgeladen sind", "", { gross: true, dashed: true });
  return html;
}

function renderSubject() {
  const f = aktuellesFach();
  let html = breadcrumb([{ label: "Start", onClick: "gehezuHome()" }, { label: f.kurz }]);
  html += kopf(f.titel, `Az. ${f.az}`);
  html += `<div class="section-label">PRÜFUNG</div>`;
  html += ordnerkachel("Prüfung – alle Themen gemischt", "bei jedem Start neu zufällig zusammengestellt", "gehezuPruefung()", { akzent: true });
  html += `<div class="section-label" style="margin-top:14px;">THEMENGEBIETE ZUM NACHSCHLAGEN</div>`;
  f.topics.forEach(t => {
    html += ordnerkachel(t.titel, `${t.fragen.length} Übungsfragen`, `gehezuThema('${t.id}')`);
  });
  if (f.extra && f.extra.length) {
    html += `<div class="section-label" style="margin-top:22px;">EXTRA-ORDNER · GRUNDLAGEN DES RECHNUNGSWESENS</div>
      <p class="hinweis" style="margin-top:-4px;">Unabhängig von den Prüfungs-Themen oben – reine Nachschlage- und Übungsordner, nicht Teil des gemischten Prüfungsmodus.</p>`;
    f.extra.forEach(t => {
      html += ordnerkachel(t.titel, `${t.fragen.length} Übungsfragen`, `gehezuThema('${t.id}')`);
    });
  }
  return html;
}

function renderTopic() {
  const f = aktuellesFach();
  const t = aktuellesThema();
  let html = breadcrumb([
    { label: "Start", onClick: "gehezuHome()" },
    { label: f.kurz, onClick: `gehezuFach('${f.id}')` },
    { label: t.kurz },
  ]);
  html += `<h2>${esc(t.titel)}</h2>`;
  t.nachschlagen.forEach((block, i) => {
    html += `<div class="card"><div class="num">${String(i + 1).padStart(2, "0")}</div><h4>${esc(block.h)}</h4><p class="body-text">${esc(block.t)}</p></div>`;
  });

  const fragen = t.fragen;
  if (fragen.length > 0) {
    const erg = ergebnisseFuerThema();
    const richtig = fragen.filter(f2 => erg[f2.id]?.status === "richtig").length;
    html += `<div class="section-label">ÜBUNGSFRAGEN · ${richtig}/${fragen.length} richtig</div>`;
    html += fortschrittsleiste(fragen, erg, state.index, "themaSpringe");
    const frage = fragen[state.index];
    html += karteikarte(frage, state.index, fragen.length, erg, false, null);
    html += `<div class="navrow">
      <button class="ghost" ${state.index === 0 ? "disabled" : ""} onclick="themaZurueck()">← Zurück</button>
      <button class="ghost" ${state.index === fragen.length - 1 ? "disabled" : ""} onclick="themaWeiter()">Weiter →</button>
    </div>`;
  }
  return html;
}

function renderExamSetup() {
  const f = aktuellesFach();
  const pool = alleFragenMitThema(f);
  let html = breadcrumb([{ label: "Start", onClick: "gehezuHome()" }, { label: f.kurz, onClick: `gehezuFach('${f.id}')` }, { label: "Prüfung" }]);
  const optionen = [5, 10, 15, pool.length].filter((v, i, a) => a.indexOf(v) === i && v <= pool.length);
  html += `<div class="center-card">
    <h2 style="font-size:20px;">Prüfung starten</h2>
    <p class="body-text" style="margin-bottom:18px;">Fragen aus allen Themengebieten von ${esc(f.titel)} werden zufällig gemischt. Jede neue Prüfung stellt eine neue, willkürliche Auswahl und Reihenfolge zusammen.</p>
    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px;">
      <label style="font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted);">Anzahl Fragen:</label>
      <select onchange="setAnzahl(this.value)">
        ${optionen.map(n => `<option value="${n}" ${n === state.anzahl ? "selected" : ""}>${n === pool.length ? `alle (${n})` : n}</option>`).join("")}
      </select>
    </div>
    <button class="danger" onclick="starteNeuePruefung()">Prüfung starten</button>
  </div>`;
  return html;
}

function renderExamActive() {
  const f = aktuellesFach();
  let html = breadcrumb([{ label: "Start", onClick: "gehezuHome()" }, { label: f.kurz, onClick: `gehezuFach('${f.id}')` }, { label: "Prüfung" }]);
  const beantwortet = Object.keys(state.pruefungsErgebnisse).length;
  const richtig = Object.values(state.pruefungsErgebnisse).filter(r => r.status === "richtig").length;
  html += `<div class="section-label">PRÜFUNG · ${beantwortet}/${state.pruefungsfragen.length} beantwortet · ${richtig} richtig</div>`;
  html += fortschrittsleiste(state.pruefungsfragen, state.pruefungsErgebnisse, state.pruefungIndex, "examSpringe");
  const frage = state.pruefungsfragen[state.pruefungIndex];
  html += karteikarte(frage, state.pruefungIndex, state.pruefungsfragen.length, state.pruefungsErgebnisse, true, true);
  html += `<div class="navrow">
    <button class="ghost" ${state.pruefungIndex === 0 ? "disabled" : ""} onclick="examZurueck()">← Zurück</button>
    <button class="ghost" ${state.pruefungIndex === state.pruefungsfragen.length - 1 ? "disabled" : ""} onclick="examWeiter()">Weiter →</button>
  </div>
  <button onclick="examAbbrechen()" style="margin-top:16px;background:transparent;border:none;color:var(--accent);font-family:'IBM Plex Mono',monospace;font-size:12px;cursor:pointer;text-decoration:underline;">Prüfung abbrechen</button>`;
  return html;
}

function renderExamDone() {
  const f = aktuellesFach();
  const richtig = Object.values(state.pruefungsErgebnisse).filter(r => r.status === "richtig").length;
  let html = breadcrumb([{ label: "Start", onClick: "gehezuHome()" }, { label: f.kurz, onClick: `gehezuFach('${f.id}')` }, { label: "Prüfung" }]);
  html += `<div class="center-card">
    <div style="margin-bottom:10px;">${stempel(richtig === state.pruefungsfragen.length ? "richtig" : "teilweise")}</div>
    <h2 style="margin:10px 0 6px 0;">${richtig} von ${state.pruefungsfragen.length} richtig</h2>
    <p style="font-size:13.5px;color:var(--muted);margin:0 0 20px 0;">Jede neue Prüfung mischt Auswahl und Reihenfolge erneut zufällig.</p>
    <div style="display:flex;gap:10px;justify-content:center;">
      <button class="danger" onclick="starteNeuePruefung()">Neue Prüfung</button>
      <button class="ghost" onclick="examAbbrechen()">Zurück</button>
    </div>
  </div>`;
  return html;
}

function render() {
  let html = "";
  if (state.screen === "home") html = renderHome();
  else if (state.screen === "subject") html = renderSubject();
  else if (state.screen === "topic") html = renderTopic();
  else if (state.screen === "exam") {
    if (!state.pruefungAktiv) html = renderExamSetup();
    else {
      const beantwortet = Object.keys(state.pruefungsErgebnisse).length;
      const fertig = beantwortet === state.pruefungsfragen.length && state.pruefungsfragen.length > 0;
      html = fertig ? renderExamDone() : renderExamActive();
    }
  }
  document.getElementById("app").innerHTML = html;
}

render();
</script>
</body>
</html>
